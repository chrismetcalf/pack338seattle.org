title: Cub Scout Pack 338 Seattle
description: Cub Scout Pack 338 in Wedgwood, NE Seattle — open to kids of all genders, grades K–5, from any school, and from any faith background or none at all.
url: "https://pack338seattle.org"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# Event times in _data/events.yml are Pacific; build in that zone so Liquid's
# date filters render them correctly regardless of where the build runs.
timezone: America/Los_Angeles

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Collections
collections:
  posts:
    output: true
    permalink: /:collection/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - .vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - README.md
  - CLAUDE.md
  - "*.sh"
  - script/
  - assets/images/README.md
