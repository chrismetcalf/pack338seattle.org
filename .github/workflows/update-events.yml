name: Update calendar events

# Refreshes _data/events.yml from the Groups.io calendar so the homepage can
# render upcoming events at build time instead of fetching them in the browser.
# Committing the result triggers the normal Pages deploy.

on:
  schedule:
    # 13:00 UTC — early morning Pacific, before anyone is likely to look.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "update-events"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Fetch calendar feed
        env:
          TZ: America/Los_Angeles
        run: ruby script/fetch-events.rb

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/events.yml; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/events.yml
          git commit -m "Update calendar events"
          git push
